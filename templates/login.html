<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Predictability Score</title>
    <link rel="icon" href="{{ url_for('static', filename='images/P.logo.png') }}" type="image/png">
    <style>
        :root {
            --bg-color: #f8f9fa; --container-bg: #ffffff; --text-color: #212529;
            --subtle-text-color: #6c757d; --border-color: #dee2e6; --primary-color: #007bff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212; --container-bg: #1e1e1e; --text-color: #e9ecef;
                --subtle-text-color: #adb5bd; --border-color: #495057; --primary-color: #0d6efd;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .login-container {
            max-width: 400px; width: 100%; padding: 40px; background: var(--container-bg);
            border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-color); }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        .button-group button { flex-grow: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1em; background-color: var(--primary-color); color: white; }
        #auth-error { margin-top: 15px; color: #d9534f; text-align: center; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 0.9em; }
        .footer-link a { color: var(--primary-color); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/">
                <img src="{{ url_for('static', filename='images/P.logo.png') }}" alt="Logo" style="max-height: 80px;">
            </a>
        </div>
        <h1>The Predictability Score</h1>
        <div class="form-group"><label for="username">Username</label><input type="text" id="username" required></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div>
        <div class="button-group">
            <button id="login-btn">Login</button>
            <button id="register-btn">Register</button>
        </div>
        <p id="auth-error"></p>
        <div class="footer-link">
            <a href="/">Back to Home</a>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const authErrorP = document.getElementById('auth-error');

        async function handleAuth(endpoint) {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                authErrorP.textContent = 'Username and password are required.';
                return;
            }
            try {
                const response = await fetch(`/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed.');
                }
                if (endpoint === 'register') {
                    alert('Registration successful! Please log in.');
                    usernameInput.value = '';
                    passwordInput.value = '';
                } else {
                    window.location.href = '/calculator'; // Redirect to calculator on successful login
                }
            } catch (err) {
                authErrorP.textContent = err.message;
            }
        }

        loginBtn.addEventListener('click', () => handleAuth('login'));
        registerBtn.addEventListener('click', () => handleAuth('register'));
        passwordInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                loginBtn.click();
            }
        });
    </script>
</body>
</html>
