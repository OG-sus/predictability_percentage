<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Overlay</title>
    <style>
        body { background-color: transparent; }
        .ai-audit-box {
            position: absolute;
            top: 120px;
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0000; /* Bright red border for visibility */
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            text-align: center;
            z-index: 100;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        .ai-audit-title { font-size: 0.9em; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .ai-audit-score { font-size: 2.5em; font-weight: bold; }
        .ai-audit-status { font-size: 1.2em; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ai-audit-box">
        <div class="ai-audit-title">AI Audit: TEST</div>
        <div class="ai-audit-score">100</div>
        <div class="ai-audit-status">VISIBLE?</div>
    </div>
</body>
</html>
