<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Predictability Score</title>
    <style>
        :root {
            --bg-color: #f8f9fa; --container-bg: #ffffff; --text-color: #212529;
            --subtle-text-color: #6c757d; --border-color: #dee2e6; --primary-color: #007bff;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212; --container-bg: #1e1e1e; --text-color: #e9ecef;
                --subtle-text-color: #adb5bd; --border-color: #495057; --primary-color: #0d6efd;
                --shadow-color: rgba(0, 0, 0, 0.2);
            }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); }
        .header { background-color: var(--container-bg); padding: 20px; border-bottom: 1px solid var(--border-color); text-align: center; box-shadow: 0 2px 10px var(--shadow-color); }
        .title-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 10px; }
        .header .logo { max-height: 50px; width: auto; }
        .header h1 { margin: 0; font-size: 2em; color: var(--primary-color); font-weight: bold; }
        .header h1 a { color: inherit; text-decoration: none; }
        .nav { margin-top: 10px; }
        .nav a { color: var(--primary-color); text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 1.1em; }
        .nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 40px auto; padding: 30px; background: var(--container-bg); border-radius: 12px; box-shadow: 0 8px 30px var(--shadow-color); }
        h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        a { color: var(--primary-color); }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <img src="/static/images/P.logo.png" alt="Logo" class="logo">
            <h1><a href="/">The Predictability Score</a></h1>
        </div>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/calculator">Calculator</a>
            <a href="/tutorial">Tutorial</a>
            <a href="/methodology">Methodology</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>Contact Us</h1>
        <p>For questions, API access, or business inquiries, please reach out to us via email.</p>
        <p><strong>Email:</strong> <a href="mailto:predictabilitycalculator@gmail.com">predictabilitycalculator@gmail.com</a></p>
    </div>
</body>
</html>
