<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FSR Live Ticker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0f1117;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #f5f7fa;
    overflow: hidden;
  }

  #wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 10px 14px 10px;
    gap: 8px;
  }

  /* ── Header ── */
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #39c2ff;
    padding-bottom: 6px;
    flex-shrink: 0;
  }
  #hud-brand  { font-size: 13px; font-weight: bold; color: #39c2ff; letter-spacing: 1.5px; }
  #hud-group  { font-size: 12px; font-weight: bold; color: #ffd166; letter-spacing: 1px; }
  #hud-right  { display: flex; align-items: center; gap: 10px; }
  #hud-time   { font-size: 11px; color: #aab6c4; }
  #hud-dot    { width: 7px; height: 7px; border-radius: 50%; background: #00ff88; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── Progress bar ── */
  #progress-bar {
    height: 2px;
    background: rgba(57,194,255,0.15);
    flex-shrink: 0;
    border-radius: 1px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: #39c2ff;
    transition: width 20s linear;
  }

  /* ── Card grid ── */
  #grid-wrap {
    flex: 1;
    min-height: 0;
    transition: opacity 0.5s ease;
  }
  #grid-wrap.fading { opacity: 0; }

  #card-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
    height: 100%;
  }

  .ticker-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .ticker-card.up   { border-left: 2px solid #00ff88; }
  .ticker-card.down { border-left: 2px solid #ff4d4d; }
  .ticker-card.flat { border-left: 2px solid #aab6c4; }

  .tc-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tc-symbol { font-size: 11px; font-weight: bold; color: #39c2ff; letter-spacing: 0.8px; }
  .tc-fsr { font-size: 10px; font-weight: bold; }
  .fsr-high { color: #00ff88; }
  .fsr-mid  { color: #ffd166; }
  .fsr-low  { color: #ff4d4d; }
  .fsr-none { color: #4a5568; }

  .tc-price  { font-size: 15px; font-weight: bold; color: #f5f7fa; line-height: 1; }
  .tc-change { font-size: 11px; font-weight: bold; }
  .tc-change.up   { color: #00ff88; }
  .tc-change.down { color: #ff4d4d; }
  .tc-change.flat { color: #aab6c4; }

  /* ── Group dots ── */
  #group-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(57,194,255,0.25);
    transition: background 0.3s;
  }
  .dot.active { background: #39c2ff; }

  #loading-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; background: #0f1117;
  }
  #loading-screen span { color: #39c2ff; font-size: 13px; letter-spacing: 2px; }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid rgba(57,194,255,0.2);
    border-top-color: #39c2ff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <span>FETCHING LIVE DATA...</span>
</div>

<div id="wrapper" style="display:none">
  <div id="hud">
    <span id="hud-brand">FSR™ LIVE MARKETS</span>
    <span id="hud-group"></span>
    <div id="hud-right">
      <div id="hud-dot"></div>
      <span id="hud-time"></span>
    </div>
  </div>

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <div id="grid-wrap">
    <div id="card-grid"></div>
  </div>

  <div id="group-dots"></div>
</div>

<script>
const ROTATE_MS  = 20000;
const REFRESH_MS = 60000;
const FADE_MS    = 500;

let groups     = [];
let groupIdx   = 0;
let rotateTimer = null;
let failCount  = 0;

function fsrClass(v) {
  if (v == null) return 'fsr-none';
  if (v >= 80)   return 'fsr-high';
  if (v >= 60)   return 'fsr-mid';
  return 'fsr-low';
}
function dirClass(v) { return v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'flat'; }
function pctStr(v)   { return (v > 0 ? '+' : '') + v.toFixed(2) + '%'; }
function priceStr(v, sym) {
  if (!v) return '--';
  if (sym === 'BTC' || sym === 'ETH' || sym === 'SOL')
    return '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return '$' + v.toFixed(2);
}

function buildDots() {
  const el = document.getElementById('group-dots');
  el.innerHTML = groups.map((_, i) => `<div class="dot${i === groupIdx ? ' active' : ''}" id="dot-${i}"></div>`).join('');
}

function updateDots() {
  groups.forEach((_, i) => {
    const d = document.getElementById(`dot-${i}`);
    if (d) d.className = 'dot' + (i === groupIdx ? ' active' : '');
  });
}

function renderGroup(idx) {
  const g = groups[idx];
  if (!g) return;
  document.getElementById('hud-group').textContent = g.label;
  const grid = document.getElementById('card-grid');
  grid.innerHTML = g.cards.map(t => {
    const dir = dirClass(t.change_pct);
    return `
      <div class="ticker-card ${dir}">
        <div class="tc-top">
          <span class="tc-symbol">${t.symbol}</span>
          <span class="tc-fsr ${fsrClass(t.fsr)}">${t.fsr != null ? t.fsr + '%' : '—'}</span>
        </div>
        <span class="tc-price">${priceStr(t.price, t.symbol)}</span>
        <span class="tc-change ${dir}">${pctStr(t.change_pct)}</span>
      </div>`;
  }).join('');
}

function startProgress() {
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${ROTATE_MS}ms linear`;
    fill.style.width = '100%';
  }));
}

function rotate() {
  const wrap = document.getElementById('grid-wrap');
  wrap.classList.add('fading');
  setTimeout(() => {
    groupIdx = (groupIdx + 1) % groups.length;
    renderGroup(groupIdx);
    updateDots();
    wrap.classList.remove('fading');
    startProgress();
  }, FADE_MS);
}

function startRotation() {
  if (rotateTimer) clearInterval(rotateTimer);
  renderGroup(groupIdx);
  startProgress();
  rotateTimer = setInterval(rotate, ROTATE_MS);
}

function updateClock() {
  document.getElementById('hud-time').textContent =
    new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

async function fetchData() {
  try {
    const res  = await fetch('/stream/ticker/data');
    const data = await res.json();
    failCount = 0;
    if (!data.ready || !data.groups || !data.groups.length) return;

    const wasEmpty = groups.length === 0;
    groups = data.groups;

    if (wasEmpty) {
      buildDots();
      startRotation();
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('wrapper').style.display = 'flex';
    }
  } catch (e) {
    failCount++;
    if (failCount >= 3) location.reload();
  }
}

fetchData();
setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
