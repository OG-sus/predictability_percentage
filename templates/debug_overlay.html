<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug Overlay</title>
    <style>
        /* This is a self-contained file. No external dependencies. */
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        .debug-box {
            position: absolute;
            top: 100px;
            right: 100px;
            width: 300px;
            height: 150px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 5px solid red;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="debug-box">
        IF YOU CAN SEE THIS, OBS IS WORKING.
    </div>

</body>
</html>
